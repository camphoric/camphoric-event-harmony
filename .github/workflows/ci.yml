# Type-check, test (including the spec's conformance checks), lint, and
# smoke-test the package as it's published, on every push to main and PR. It
# also runs on demand, and from upstream.yml, where it can pick exact
# import-spec / import-tools versions instead of the lockfile's.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      spec_version:
        description: An exact @camphoric/camphoric-event-import-spec version to test, in this event's range or not, such as a new major or 1.1.0-rc.1 (default the lockfile's)
        type: string
        default: ''
      tools_version:
        description: An exact @camphoric/camphoric-event-import-tools version to test, in this event's range or not, such as a new major or 1.3.0-rc.1 (default the lockfile's)
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      spec_version:
        description: An exact @camphoric/camphoric-event-import-spec version to test, in this event's range or not, such as a new major or 1.1.0-rc.1 (default the lockfile's)
        type: string
        default: ''
      tools_version:
        description: An exact @camphoric/camphoric-event-import-tools version to test, in this event's range or not, such as a new major or 1.3.0-rc.1 (default the lockfile's)
        type: string
        default: ''

# A literal prefix: called from upstream.yml, github.workflow is the caller's
# name, which e2e.yml would share. Pushes and PRs queue per ref (a new push to
# a PR cancels its superseded run); every other run gets its own group.
concurrency:
  group: ci-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Use the requested Camphoric package versions
        if: ${{ inputs.spec_version || inputs.tools_version }}
        env:
          SPEC: ${{ inputs.spec_version }}
          TOOLS: ${{ inputs.tools_version }}
        run: |
          packages=()
          if [ -n "$SPEC" ]; then packages+=("@camphoric/camphoric-event-import-spec@$SPEC"); fi
          if [ -n "$TOOLS" ]; then packages+=("@camphoric/camphoric-event-import-tools@$TOOLS"); fi
          # A version outside a peer range (a new major, a pre-release) can make
          # npm refuse; then install it over the range
          npm install --no-save "${packages[@]}" || {
            echo "::warning::npm refused ${packages[*]}; installing again with --force, over the peer ranges"
            npm install --no-save --force "${packages[@]}"
          }
          # Check each installed package's own version: npm ls fails on one
          # outside this event's range, though it's installed
          for package in "${packages[@]}"; do
            name=${package%@*}
            want=${package##*@}
            have=$(node -p "require('./node_modules/' + process.argv[1] + '/package.json').version" "$name")
            if [ "$have" != "$want" ]; then
              echo "::error::$name $have is installed, not $want (give an exact version)"
              exit 1
            fi
          done
          {
            echo '### Camphoric packages'
            echo
            echo '(`invalid` marks a version outside the range in `package.json`.)'
            echo
            echo '```'
            npm ls @camphoric/camphoric-event-import-spec @camphoric/camphoric-event-import-tools || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npx eslint .

      - name: The packed package works under plain Node
        env:
          SPEC_VERSION: ${{ inputs.spec_version }}  # its peer (default npm's newest in range)
        run: scripts/smoke-test-package.sh
